name: E610 Ubuntu and Rocky exact-kernel validation
on:
  push:
    branches: [codex/expanded-linux]
    paths: ['expanded/**', '.github/workflows/expanded.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 expanded/discover.py
      - id: matrix
        run: echo "matrix=$(jq -c '[.[] | {id}]' output/inventory.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: expanded-inventory
          path: output/
          retention-days: 7
  kernels:
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: expanded-inventory
          path: inventory/
      - name: Prepare build and actual-kernel boot tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-11 gcc-12 gcc-13 build-essential libelf-dev libssl-dev kmod curl openssl xorriso squashfs-tools qemu-system-x86 busybox-static cpio zstd
      - name: Inspect native support, compile missing drivers, boot each exact kernel
        run: python3 expanded/prepare.py inventory/inventory.json '${{ matrix.id }}' "$RUNNER_TEMP/e610" "$PWD/output/${{ matrix.id }}"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kernel-${{ matrix.id }}
          path: output/
          retention-days: 7
