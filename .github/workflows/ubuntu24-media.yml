name: E610 Ubuntu 24.04 KVM media
on:
  push:
    branches: [codex/ubuntu24-offline]
    paths: ['ubuntu24-media/**', '.github/workflows/ubuntu24-media.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare ISO tools and download the already tested driver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xorriso
          mkdir -p "$RUNNER_TEMP/kernel-debs"
          (cd "$RUNNER_TEMP/kernel-debs" && apt-get download linux-image-6.8.0-31-generic=6.8.0-31.31 linux-modules-6.8.0-31-generic=6.8.0-31.31)
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/driver.tar.gz" https://github.com/SkyWalkerAMD-org/E610/releases/download/v6.4.5-ubuntu24.04-6.8.0-31-r1/E610-Ubuntu24.04-6.8.0-31-r1.tar.gz
      - name: Build the single-file installer and KVM ISO
        run: |
          bash -n ubuntu24-media/launcher.sh.in
          bash -n ubuntu24-media/install.sh ubuntu24-media/test.sh ubuntu24-media/finalize.sh
          python3 ubuntu24-media/build.py --archive "$RUNNER_TEMP/driver.tar.gz" --work "$RUNNER_TEMP/e610-media" --output "$PWD/output/ubuntu24-media"
      - name: Test the actual read-only ISO and offline installation
        run: |
          mkdir -p "$RUNNER_TEMP/e610-mounted"
          test "$(blkid -p -s LABEL -o value output/ubuntu24-media/*.iso)" = E610_UBU2404
          sudo mount -o loop,ro output/ubuntu24-media/*.iso "$RUNNER_TEMP/e610-mounted"
          test "$(findmnt -n -o FSTYPE --target "$RUNNER_TEMP/e610-mounted")" = iso9660
          docker build -f ubuntu24-e610/test/Dockerfile -t e610-ubuntu24-media-test .
          set -o pipefail
          docker run --rm --network none --entrypoint bash -v "$RUNNER_TEMP/e610-mounted:/media:ro" -v "$RUNNER_TEMP/kernel-debs:/kernel-debs:ro" -v "$PWD/ubuntu24-media/test.sh:/media-test.sh:ro" e610-ubuntu24-media-test /media-test.sh 2>&1 | tee output/ubuntu24-media/media-test.log
      - name: Finalize validation and checksums
        run: bash ubuntu24-media/finalize.sh "$PWD/output/ubuntu24-media"
      - name: Detach test ISO
        if: always()
        run: if mountpoint -q "$RUNNER_TEMP/e610-mounted"; then sudo umount "$RUNNER_TEMP/e610-mounted"; fi
      - name: Save tested installation media
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: E610-Ubuntu24.04-KVM-media
          path: output/ubuntu24-media/
          if-no-files-found: error
          retention-days: 7
